<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ㅤ</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  width: 100%;
  height: 100vh;
  background: #ffffff;
  display: flex;
  justify-content: center;
  align-items: center;
  font-family: Arial, sans-serif;
}

/* Tombol invisible */
#copyButton {
  width: 85vw;
  height: 50vh;
  background: transparent;
  border: none;
  outline: none;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
}

/* Notifikasi */
#notification {
  position: fixed;
  bottom: 35px;
  left: 50%;
  transform: translate(-50%, 20px);
  background: #222;
  color: white;
  padding: 13px 22px;
  border-radius: 30px;
  font-size: 14px;
  opacity: 0;
  transition: .3s;
  pointer-events: none;
}

#notification.show {
  opacity: 1;
  transform: translate(-50%, 0);
}
</style>
</head>

<body>

<button id="copyButton" aria-label="Copy teks"></button>

<div id="notification">ㅤ</div>

<script>
const button = document.getElementById("copyButton");
const notification = document.getElementById("notification");

button.addEventListener("click", async () => {
  try {
    const response = await fetch("Setting.txt", {
      cache: "no-store"
    });

    if (!response.ok) {
      throw new Error("File Setting.txt tidak ditemukan");
    }

    const text = await response.text();

    if (!text.trim()) {
      throw new Error("Setting.txt masih kosong");
    }

    await navigator.clipboard.writeText(text);

    notification.textContent = "Berhasil disalin!";
  } catch (error) {
    notification.textContent = "Gagal menyalin teks!";
  }

  notification.classList.add("show");

  setTimeout(() => {
    notification.classList.remove("show");
  }, 2000);
});
</script>

</body>
</html>
